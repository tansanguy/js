  net_file: data_prepared/net/jungbu_area.net.xml
  netconvert_command: data_prepared/net/netconvert_command.txt
  net_audit: data_prepared/net/net_audit.json
  map_manifest: data_prepared/net/map_manifest.json
  sumo_edges_geojson: data_prepared/geojson/sumo_edges.geojson
  sumo_tls_geojson: data_prepared/geojson/sumo_tls.geojson
  step03_geojson_audit: data_prepared/geojson/step03_geojson_audit.json
  map_review_html: results/html/map_review.html
  selected_edges_schema: data_prepared/manual/selected_edges.schema.json
